<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Idarəetmə</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <span>K</span>
            <h2>Kanban Idarəetmə</h2>
        </div>
        <nav>
            <div class="inputContainer">
                <input type="text" id="searchInput" placeholder="Tapşırıq axınında axtar">
                <span class="searchMark">🔍</span>
            </div>
            <select id="priorityFilter">
                <option value="all">⚡Bütün prioritetlər</option>
                <option value="low">🟢 Aşağı</option>
                <option value="medium">🟠 Orta</option>
                <option value="high">🔴 Yüksək</option>
            </select>
            <button id="openModalBtn">+Yeni Tapşırıq</button>
        </nav>
    </header>
    <main>
        <section>
            <div class="to-do" data-status="todo" data-aos="zoom-in"   data-aos-duration="2000">
                <div class="to-do-title">
                   <h6>🔵 Gözləmədə</h6>
                   <span id="todo-count">0</span>
                </div>
                <div class="task-list" id="todo-list"></div>
            </div>
            <div class="doing" data-status="doing" data-aos="zoom-in"   data-aos-duration="2000">
                <div class="doing-title">
                   <h6>🟠 İcra olunur </h6>
                   <span id="doing-count">0</span>
                </div>
                <div class="task-list" id="doing-list"></div>
            </div>
            <div class="done" data-status="done" data-aos="zoom-in"   data-aos-duration="2000">
                <div class="done-title">
                   <h6>🟢 Tamamlandı</h6>
                   <span id="done-count">0</span>
                </div>
                <div class="task-list" id="done-list"></div>
            </div>
        </section>
      
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h3 id="modalTitle">Yeni Tapşırıq Yarat</h3>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>Başlıq *</label>
                    <input type="text" id="taskTitle" placeholder="DEVJOINT" required>
                </div>
                <div class="form-group">
                    <label>Açıqlama</label>
                    <textarea id="taskDesc" placeholder="Tapşırıq haqqında qısa qeyd..."></textarea>
                </div>
                <div class="form-group">
                    <label>Prioritet dərəcəsi</label>
                    <select id="taskPriority">
                        <option value="low">Aşağı (Low)</option>
                        <option value="medium">Orta (Medium)</option>
                        <option value="high">Yüksək (High)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="closeModalBtn">Ləğv et</button>
                    <button type="submit" class="btn-save">Yadda saxla</button>
                </div>
            </form>
        </div>
    </div>
    </main>
    <footer>
        <h3>Sama Goyushova</h3>
    </footer>
    <script src="app.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
    AOS.init();
    </script>
</body>
</html>
